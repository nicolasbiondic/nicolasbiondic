name: Contribution graphs

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Neither action below reads repository content, only the username and
      # the default GITHUB_TOKEN to query the contributions GraphQL API, so
      # no checkout step is needed here (and no credentials get persisted).

      # Runs before the snake step: it is a node action that writes to dist/
      # as the runner user, while the snake step below is a docker action
      # that writes as root and would leave dist/ unwritable for this one.
      - name: Generate Pac-Man animation
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution graphs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
